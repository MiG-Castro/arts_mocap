# BLE - ISO ==============================================
CONFIG_BT_CTLR_ADV_DATA_LEN_MAX=191
CONFIG_BT_CTLR_ADV_ISO=y
CONFIG_BT_ISO_BROADCASTER=y
CONFIG_BT_CTLR_ADV_ISO_STREAM_MAX=1
CONFIG_BT_ISO_TX_BUF_COUNT=1
CONFIG_BT_CTLR_ISO_TX_BUFFER_SIZE=10
CONFIG_BT_CTLR_ADV_ISO_PDU_LEN_MAX=10
CONFIG_BT_ISO_TX_MTU=4
# CONFIG_BT_ISO_MAX_CHAN=2
# CONFIG_BT_CTLR_ADV_ISO_STREAM_MAX=2
# CONFIG_BT_CTLR_ISOAL_SOURCES=2

# Stacks ===================================================
CONFIG_BT_RECV_WORKQ_BT=y
CONFIG_BT_RX_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=4096
# Memoria dinamica de emergencia
CONFIG_HEAP_MEM_POOL_SIZE=2048

# USB CDC =================================================
CONFIG_USB_CDC_ACM=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_UART_LINE_CTRL=y
CONFIG_SERIAL=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_LOG=n
CONFIG_STDOUT_CONSOLE=n
# CONFIG_USB_DEVICE_PRODUCT="Zephyr CDC ACM sample"
# CONFIG_USB_DEVICE_PID=0x0001
# CONFIG_CONSOLE=n
# CONFIG_UART_CONSOLE=n

# LOGGING ===========================================================
# CONFIG_LOG=y
# CONFIG_LOG_MODE_DEFERRED=y
# Nivel de log (3=INF, 2=WRN, 1=ERR, 0=OFF)
# CONFIG_LOG_DEFAULT_LEVEL=1

# BLE ===============================================================
CONFIG_BT=y
CONFIG_BT_LL_SOFTDEVICE=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_PERIPHERAL=n
CONFIG_BT_DEVICE_NAME="Central_N"
# Multiconexion
CONFIG_BT_CONN_CTX=y
CONFIG_BT_MAX_CONN=12
# Filtros para el scan
CONFIG_BT_SCAN=y
CONFIG_BT_SCAN_FILTER_ENABLE=y
CONFIG_BT_SCAN_ADDRESS_CNT=18
CONFIG_BT_SCAN_UUID_CNT=1
# Configuracion GATT->Cliente
CONFIG_BT_GATT_DM=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_AUTO_DISCOVER_CCC=n
CONFIG_BT_GATT_AUTO_UPDATE_MTU=n
# L2CAP 
CONFIG_BT_L2CAP_TX_BUF_COUNT=12
CONFIG_BT_L2CAP_TX_MTU=83
# ATT/GATT Buffers
CONFIG_BT_CONN_TX_MAX=12
CONFIG_BT_ATT_TX_COUNT=12
CONFIG_BT_BUF_ACL_TX_SIZE=27
# CONFIG_BT_BUF_ACL_RX_COUNT=12
CONFIG_BT_BUF_ACL_RX_SIZE=80
# PHY 2M Support
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_PHY_UPDATE=y
CONFIG_BT_CTLR_PHY_2M=y
# Data Length Extension
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_AUTO_DATA_LEN_UPDATE=n
CONFIG_BT_CTLR_DATA_LENGTH_MAX=80
# Connection Parameters
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n
# Connection Event Length
CONFIG_BT_CTLR_SDC_MAX_CONN_EVENT_LEN_DEFAULT=2000